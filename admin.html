<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت سفارش‌های تبلیغات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Tahoma,Arial,sans-serif}
header{background:#111;color:#fff;padding:25px;text-align:center}main{max-width:1100px;margin:25px auto;padding:0 14px}
.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:20px;margin-bottom:18px}
input{padding:12px;border:1px solid #ccc;border-radius:8px;width:100%;font:inherit;margin:7px 0 13px}
button{border:0;background:#111;color:white;padding:10px 16px;border-radius:8px;cursor:pointer;margin:4px;font:inherit}
button.danger{background:#a40020}button.ok{background:#087a37}button:disabled{opacity:.5}
.order{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
img{max-width:100%;max-height:260px;object-fit:contain;border:1px solid #ddd;border-radius:8px}
.muted{color:#666;font-size:13px;line-height:1.8}.status{font-weight:bold}
#message{white-space:pre-wrap;color:#b00020}
</style></head><body><header><h1>پنل مدیریت سفارش‌ها</h1></header><main>
<section class="card" id="loginCard"><h2>ورود مدیر</h2>
<label>ایمیل</label><input id="email" type="email" autocomplete="username">
<label>رمز عبور</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">ورود</button><div id="message"></div>
<p class="muted">برای ورود از همان حسابی استفاده کنید که UUID آن را در جدول ad_admins ثبت کردید.</p></section>
<section class="card" id="panel" hidden><button id="logoutBtn">خروج</button><button id="refreshBtn">به‌روزرسانی سفارش‌ها</button><div id="orders"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://kxlcaoxfkscyivgvtiei.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_MU_VMXpbogJ5vYfvwstlRg_tbmygwNE";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const msg=document.getElementById('message'), loginCard=document.getElementById('loginCard'), panel=document.getElementById('panel');
const statusText={pending:'در انتظار بررسی',approved:'تأیید شده',rejected:'رد شده'};
async function refresh(){
 const box=document.getElementById('orders');box.textContent='در حال دریافت سفارش‌ها...';
 const {data,error}=await db.from('ad_orders').select('*').order('created_at',{ascending:false});
 if(error){box.textContent='خطا: '+error.message;return;}
 if(!data.length){box.textContent='هنوز سفارشی ثبت نشده است.';return;}
 box.innerHTML='';
 for(const o of data){
  const el=document.createElement('article');el.className='order';
  const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  el.innerHTML=`<h3>${safe(o.customer_name)} — ${safe(o.tracking_code)}</h3>
  <p>راه ارتباطی: ${safe(o.contact)}</p><p>تاریخ تبلیغ: ${safe(o.ad_date)}</p>
  <p>مدت زمان: ${safe(({ '12h':'۱۲ ساعت','24h':'۲۴ ساعت',permanent:'دائمی',special:'ویژه' })[o.duration]||'—')}</p>
  <p>آپشن / پست آخر: ${safe(({ none:'بدون آپشن','1h':'۱ ساعت','2h':'۲ ساعت' })[o.post_option]||'—')}</p>
  <p>صورت‌حساب: ${safe(Number(o.amount_coins||0).toLocaleString('fa-IR'))} سکه</p><p>وضعیت: <span class="status">${safe(statusText[o.status]||o.status)}</span></p>
  <p>توضیحات: ${safe(o.notes)}</p><div class="grid"><div><b>بنر</b><div class="banner">در حال دریافت...</div></div><div><b>رسید پرداخت</b><div class="receipt">در حال دریافت...</div></div></div>
  <button class="ok approve">تأیید سفارش</button><button class="danger reject">رد سفارش</button>`;
  box.appendChild(el);
  for(const [cls,path] of [['banner',o.banner_path],['receipt',o.receipt_path]]){
   const {data:file,error:e}=await db.storage.from('ad-uploads').createSignedUrl(path,300);
   const target=el.querySelector('.'+cls);
   if(e){target.textContent='نمایش فایل ممکن نیست';continue;}
   target.innerHTML=`<a href="${file.signedUrl}" target="_blank" rel="noopener">مشاهده تصویر</a><br><img src="${file.signedUrl}" alt="تصویر سفارش">`;
  }
  async function setStatus(status){
   const {error}=await db.from('ad_orders').update({status,reviewed_at:new Date().toISOString()}).eq('id',o.id);
   if(error){alert('خطا: '+error.message);return;} await refresh();
  }
  el.querySelector('.approve').onclick=()=>setStatus('approved');
  el.querySelector('.reject').onclick=()=>setStatus('rejected');
 }
}
document.getElementById('loginBtn').onclick=async()=>{
 msg.textContent='';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});
 if(error){msg.textContent=error.message;return;}
 const {data:admin,error:ae}=await db.from('ad_admins').select('user_id').maybeSingle();
 if(ae||!admin){await db.auth.signOut();msg.textContent='این حساب در فهرست مدیران ثبت نشده است.';return;}
 loginCard.hidden=true;panel.hidden=false;refresh();
};
document.getElementById('logoutBtn').onclick=async()=>{await db.auth.signOut();panel.hidden=true;loginCard.hidden=false;};
document.getElementById('refreshBtn').onclick=refresh;
db.auth.getSession().then(async({data})=>{if(data.session){const {data:a}=await db.from('ad_admins').select('user_id').maybeSingle();if(a){loginCard.hidden=true;panel.hidden=false;refresh();}}});
</script></body></html>
